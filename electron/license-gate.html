<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TVC-PMS — License Required</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background: #1a365d; color: #edf2f7; margin: 0; min-height: 100vh; display: grid; place-items: center; }
    .card { background: #2a4365; border-radius: 12px; padding: 28px 32px; max-width: 520px; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 12px; line-height: 1.5; color: #cbd5e0; font-size: 14px; }
    code { background: #1a365d; padding: 2px 6px; border-radius: 4px; }
    .err { color: #feb2b2; font-weight: 600; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>THE VESSEL CODE — License</h1>
    <p>This installation is licensed for a specific company, vessel, and PC.</p>
    <p>Copying the product to another vessel, company, or computer is not permitted.</p>
    <p class="err" id="msg">Checking license…</p>
  </div>
  <script>
    (async () => {
      const el = document.getElementById('msg');
      try {
        const r = await window.tvcElectron?.getLicense?.();
        el.textContent = r?.message || 'License invalid or missing.';
      } catch (e) {
        el.textContent = e.message || 'License check failed.';
      }
    })();
  </script>
</body>
</html>
