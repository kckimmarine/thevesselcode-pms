<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="theme-color" content="#1a365d">
    <meta name="description" content="Browse the IMPA ship stores catalog — search codes, view catalog plates, flange tables, and bunker calculators.">
    <title>IMPA Catalog — THE VESSEL CODE</title>
    <link rel="icon" type="image/png" href="icons/company-logo.png?v=20260804-logo-no-ring">
    <link rel="stylesheet" href="css/store.css?v=20260906-public-advanced">
    <link rel="stylesheet" href="css/store-public.css?v=20260906-public-advanced">
</head>
<body class="store-public-body store-tool-catalog">
    <div class="store-public-shell">
        <header class="store-public-header" aria-label="Maritime tools">
            <div class="store-public-brand">
                <img src="icons/company-logo.png?v=20260804-logo-no-ring" alt="" width="44" height="44" draggable="false">
                <div class="store-public-brand-text">
                    <h1 class="store-public-title">Maritime Tools &amp; IMPA Catalog</h1>
                    <p class="store-public-subtitle">Instant IMPA search · Space-Marine plates · flange &amp; bunker utilities</p>
                </div>
            </div>
            <a class="store-public-site-link" href="https://thevesselcode.com/#contact" target="_blank" rel="noopener noreferrer">Request PMS Demo</a>
        </header>

        <nav class="store-public-toolkit" id="storePublicToolkit" role="tablist" aria-label="Maritime mini-toolkit">
            <button type="button" class="store-tool-chip active" data-tool-tab="catalog" role="tab" aria-selected="true">📦 IMPA Catalog</button>
            <button type="button" class="store-tool-chip" data-tool-tab="flange" role="tab" aria-selected="false">📐 Flange Dimension Table</button>
            <button type="button" class="store-tool-chip" data-tool-tab="bunker" role="tab" aria-selected="false">⛽ Bunker Calculator</button>
        </nav>

        <div class="store-public-panels">
            <section class="store-public-panel" data-tool-panel="catalog" id="storeToolCatalog">
                <main id="storeMenuBody" class="store-public-main" aria-live="polite">
                    <p class="store-loading">Loading catalog…</p>
                </main>
            </section>
            <section class="store-public-panel hidden" data-tool-panel="flange" id="storeToolFlange" aria-label="Flange dimension table"></section>
            <section class="store-public-panel hidden" data-tool-panel="bunker" id="storeToolBunker" aria-label="Bunker calculator"></section>
        </div>

        <footer class="store-public-footer">
            <span>© 2026 THE VESSEL CODE</span>
            <a href="https://thevesselcode.com/#contact" target="_blank" rel="noopener noreferrer">Experience TVC-PMS Demo</a>
        </footer>
    </div>

    <script src="js/core/schema.js?v=20260906-plate-pipeline"></script>
    <script src="js/core/db.js?v=20260906-plate-pipeline"></script>
    <script src="js/ui/virtualList.js?v=20260723-readability"></script>
    <script src="js/services/plateImageCache.js?v=20260906-plate-pipeline"></script>
    <script src="js/services/storeManager.js?v=20260906-public-advanced"></script>
    <script src="js/ui/storeMenu.js?v=20260906-public-advanced"></script>
    <script src="js/ui/maritimeToolkit.js?v=20260906-public-advanced"></script>
    <script src="js/store-public-boot.js?v=20260906-public-advanced"></script>
</body>
</html>
