<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!--
    Official Atom editor mark geometry (open cubic strokes — NOT React closed ellipses).
    Source: github.com/atom/about … atom-logo.js
  -->
  <circle cx="128" cy="128" r="128" fill="#111111"/>

  <!-- Original mark ≈ 72×66; center (~36,~33) → scale into circular badge -->
  <g transform="translate(128 128) scale(2.55) translate(-36 -33)"
     fill="none" stroke="#9feaf9" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- orbit 1 (open) -->
    <path d="M48.578,28.615
             C56.851,45.587 58.558,61.581 52.288,64.778
             C45.822,68.076 33.326,56.521 24.375,38.969
             C15.424,21.418 13.409,4.518 19.874,1.221
             C22.689,-0.216 26.648,1.166 30.959,4.629"/>
    <!-- orbit 2 (open) -->
    <path d="M7.64,39.45
             C2.806,36.94 -0.009,33.915 0.154,30.79
             C0.531,23.542 16.787,18.497 36.462,19.52
             C56.137,20.544 71.781,27.249 71.404,34.497
             C71.241,37.622 68.127,40.338 63.06,42.333"/>
    <!-- orbit 3 (open) -->
    <path d="M28.828,59.354
             C23.545,63.168 18.843,64.561 15.902,62.653
             C9.814,58.702 13.572,42.102 24.296,25.575
             C35.02,9.048 48.649,-1.149 54.736,2.803
             C57.566,4.639 58.269,9.208 57.133,15.232"/>
  </g>

  <!-- nucleus (filled blob from Atom logo) -->
  <g transform="translate(128 128) scale(2.55) translate(-36 -33)" fill="#9feaf9" stroke="none">
    <path d="M40.363,32.075
             C40.874,34.44 39.371,36.77 37.006,37.282
             C34.641,37.793 32.311,36.29 31.799,33.925
             C31.289,31.56 32.791,29.23 35.156,28.718
             C37.521,28.207 39.851,29.71 40.363,32.075"/>
  </g>
</svg>
