<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>About &amp; Contact — THE VESSEL CODE</title>
    <!--
      Bluehost upload: public_html/contact/index.html
      WP menu label: "About & Contact" → URL: https://thevesselcode.com/contact/
    -->
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1320; }
        iframe { border: 0; width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <iframe
        id="tvcContactFrame"
        src="https://app.thevesselcode.com/about-contact/"
        title="THE VESSEL CODE — About &amp; Contact"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <script>
        (function () {
            var frame = document.getElementById('tvcContactFrame');
            if (!frame) return;
            try {
                var q = new URLSearchParams(location.search);
                if (q.get('local') === '1') frame.src = 'http://localhost:3000/about-contact/';
            } catch (_) {}
        })();
    </script>
</body>
</html>
