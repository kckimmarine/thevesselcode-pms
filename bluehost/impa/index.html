<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPA Catalog — THE VESSEL CODE</title>
    <!--
      Bluehost upload: public_html/impa/index.html
      Marketing embed: https://thevesselcode.com/impa/
    -->
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #edf2f7; }
        iframe { border: 0; width: 100%; height: 100%; display: block; }
        .load-fallback {
            color: #1a365d; font-family: system-ui, sans-serif; text-align: center;
            padding: 48px 24px; line-height: 1.6;
        }
        .load-fallback a { color: #2b6cb0; }
    </style>
</head>
<body>
    <iframe
        id="tvcImpaFrame"
        src="https://app.thevesselcode.com/store-public.html"
        title="THE VESSEL CODE — IMPA Catalog"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <noscript>
        <div class="load-fallback">
            <p>JavaScript is required for the embedded catalog.</p>
            <p><a href="https://app.thevesselcode.com/store-public.html">Open IMPA catalog</a></p>
        </div>
    </noscript>
    <script>
        (function () {
            var frame = document.getElementById('tvcImpaFrame');
            if (!frame) return;
            try {
                var q = new URLSearchParams(location.search);
                if (q.get('local') === '1') {
                    frame.src = 'http://localhost:3000/store-public.html';
                }
            } catch (_) {}
        })();
    </script>
</body>
</html>
