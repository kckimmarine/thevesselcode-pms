<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maritime Toolkit — THE VESSEL CODE</title>
    <!-- TVC-STATIC-TOOLKIT-EMBED-v2 — view-source에 이 줄이 보이면 정적 파일이 서빙된 것입니다 -->
    <!--
      Bluehost 업로드: public_html/toolkit/index.html (+ .htaccess)
      홈페이지 Toolkit 탭 링크: https://thevesselcode.com/toolkit/
      (PMS와 동일 — WordPress 페이지 embed 불필요)
    -->
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a365d; }
        iframe { border: 0; width: 100%; height: 100%; display: block; }
        .load-fallback {
            position: fixed; inset: 0; z-index: 2;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-family: system-ui, sans-serif; text-align: center;
            padding: 48px 24px; line-height: 1.6; background: #1a365d;
        }
        .load-fallback.hidden { display: none; }
        .load-fallback a { color: #90cdf4; }
        .load-fallback .hint { margin-top: 1rem; font-size: 0.9rem; opacity: 0.85; max-width: 28rem; }
    </style>
</head>
<body>
    <div id="tvcToolkitLoading" class="load-fallback" role="status" aria-live="polite">
        <p>Maritime Toolkit 로딩 중…</p>
        <p class="hint">10초 이상 이 화면이면 아래 링크로 직접 열어 보세요.</p>
        <p><a href="https://app.thevesselcode.com/toolkit" target="_blank" rel="noopener noreferrer">Toolkit 직접 열기</a></p>
    </div>
    <iframe
        id="tvcToolkitFrame"
        src="https://app.thevesselcode.com/toolkit"
        title="THE VESSEL CODE — Maritime Toolkit"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <noscript>
        <div class="load-fallback">
            <p>JavaScript가 필요합니다.</p>
            <p><a href="https://app.thevesselcode.com/toolkit">Maritime Toolkit 직접 열기</a></p>
        </div>
    </noscript>
    <script>
        (function () {
            var frame = document.getElementById('tvcToolkitFrame');
            var loading = document.getElementById('tvcToolkitLoading');
            if (!frame) return;

            function hideLoading() {
                if (loading) loading.classList.add('hidden');
            }

            frame.addEventListener('load', hideLoading);

            // Local preview: thevesselcode.com/toolkit/?local=1
            try {
                var q = new URLSearchParams(location.search);
                if (q.get('local') === '1') {
                    frame.src = 'http://localhost:3000/toolkit';
                }
            } catch (_) {}

            setTimeout(function () {
                if (loading && !loading.classList.contains('hidden')) {
                    var hint = loading.querySelector('.hint');
                    if (hint) {
                        hint.textContent = 'iframe 로드가 지연되고 있습니다. WordPress 페이지가 아닌 정적 embed인지 확인하세요 (페이지 소스에 TVC-STATIC-TOOLKIT-EMBED-v2).';
                    }
                }
            }, 10000);
        })();
    </script>
</body>
</html>
