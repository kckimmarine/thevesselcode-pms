<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maritime Toolkit — THE VESSEL CODE</title>
    <!--
      Bluehost 업로드: public_html/toolkit/index.html
      홈페이지 메뉴 링크: https://thevesselcode.com/toolkit/
      WordPress 메뉴 추가: deploy/BLUEHOST-HOMEPAGE-MENU.md
    -->
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #edf2f7; }
        iframe { border: 0; width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <iframe
        id="tvcToolkitFrame"
        src="https://app.thevesselcode.com/toolkit"
        title="THE VESSEL CODE — Maritime Toolkit"
        allow="clipboard-read; clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <script>
        (function () {
            var frame = document.getElementById('tvcToolkitFrame');
            if (!frame) return;
            try {
                var q = new URLSearchParams(location.search);
                if (q.get('local') === '1') frame.src = 'http://localhost:3000/toolkit';
            } catch (_) {}
        })();
    </script>
</body>
</html>
