name: Deploy Vercel (static web)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-vercel.yml'
      - 'vercel.json'
      - 'scripts/vercel-static-build.mjs'
      - 'scripts/smoke-web-demo.mjs'
      - 'index.html'
      - 'toolkit.html'
      - 'api/**'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      - 'icons/**'
      - 'data/**'
      - 'public/**'
      - 'admin/**'
      - 'downloads/**'
      - 'manifest.json'
      - 'service-worker.js'
      - 'package.json'

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install production dependencies
        run: npm install --omit=dev --ignore-scripts

      - name: Build static output for Vercel
        run: node scripts/vercel-static-build.mjs

      - name: Assert dist artifacts
        run: |
          test -f dist/index.html
          test -f dist/toolkit.html
          test -f dist/js/config.js
          test -f dist/data/pms-unified.json
          test -f dist/data/chapters/impa-81.json
          node -e "const d=require('./dist/data/chapters/impa-81.json'); if(!Array.isArray(d)||d.length<100) throw new Error('impa-81.json invalid')"

  deploy:
    needs: verify-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Vercel credentials
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vercel secrets missing. Push still triggers Vercel Git integration when configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Trigger Vercel production deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest deploy --prod --token "$VERCEL_TOKEN" \
            --yes \
            --scope "${VERCEL_ORG_ID:-}" \
            --project "$VERCEL_PROJECT_ID"
