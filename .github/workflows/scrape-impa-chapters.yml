name: Scrape IMPA chapters

# Regenerates public/data/chapters/*.json + impa-full.json, validates, commits to master.
# Vercel auto-deploys on push. Manual run: Actions → Scrape IMPA chapters → Run workflow.

on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Use IMPA_SCRAPER_BASE_URL (--live) instead of fixtures'
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: '0 6 * * 1'
  # Do NOT run on push to master — fixture scrapes previously overwrote the
  # Space-Marine catalog after merges. Use workflow_dispatch or schedule only.

permissions:
  contents: write

concurrency:
  group: scrape-impa-chapters
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python (Space-Marine scraper)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scrape all IMPA chapters
        env:
          IMPA_SCRAPER_BASE_URL: ${{ secrets.IMPA_SCRAPER_BASE_URL }}
          IMPA_SCRAPER_DELAY_MS: '400'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.live }}" = "true" ]; then
            if [ -z "$IMPA_SCRAPER_BASE_URL" ]; then
              echo "::error::Set repository secret IMPA_SCRAPER_BASE_URL for --live scrape"
              exit 1
            fi
            npm run scrape:impa -- --all --live
          elif [ -n "$IMPA_SCRAPER_BASE_URL" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            npm run scrape:impa -- --all --live
          else
            pip install requests beautifulsoup4
            for cat in 59 79 81 61; do
              python3 scripts/scrape_spacemarine.py --category "$cat" --delay 0.2
            done
            node scripts/merge-impa-chapters.mjs
            node scripts/generate-impa-seo-index.mjs
            node scripts/generate-sitemap.mjs
          fi

      - name: Validate scraper output
        run: npm run test:scraper

      - name: Guard against catalog shrink
        run: |
          COUNT=$(node -e "const d=require('./public/data/impa-full.json'); process.stdout.write(String(d.count||d.items?.length||0))")
          echo "impa-full.json count: $COUNT"
          if [ "$COUNT" -lt 400 ]; then
            echo "::error::Refusing to commit — impa-full.json too small ($COUNT items)"
            exit 1
          fi

      - name: Commit and push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data api/_data/impa-seo-index.json
          if git diff --staged --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "chore(ci): refresh IMPA chapter data [skip ci]"
          git push
