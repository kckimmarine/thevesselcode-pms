name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - 'cursor/**'

permissions:
  contents: read

jobs:
  build:
    name: npm run build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
