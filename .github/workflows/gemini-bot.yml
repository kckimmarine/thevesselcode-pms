name: Gemini Autonomous Bot

on:
  issues:
    types: [opened, labeled]

jobs:
  auto-apply:
    if: |
      contains(github.event.issue.labels.*.name, 'auto-deploy') &&
      (
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply patch from issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/apply-issue-patch.mjs

      - name: Commit and push
        run: |
          git config user.name "TVC-Gemini-Bot"
          git config user.email "bot@thevesselcode.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No file changes after patch apply."
            exit 0
          fi
          git commit -m "chore: auto-apply from issue #${{ github.event.issue.number }}"
          git push origin master

      - name: Comment result on issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'Patch applied and pushed to `master`.',
                'Vercel will redeploy `app.thevesselcode.com` shortly.',
                '',
                `Commit: ${context.sha}`
              ].join('\n')
            });

      - name: Comment failure on issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'Auto-apply failed.',
                'Check Actions logs for this workflow run.',
                '',
                'Issue body must contain blocks like:',
                '### `js/example.js`',
                '```javascript',
                '// file contents',
                '```'
              ].join('\n')
            });
