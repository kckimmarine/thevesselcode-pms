name: Build vessel web downloads

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-vessel-downloads.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'electron/**'
      - 'scripts/build-one-sku.mjs'

permissions:
  contents: write

jobs:
  build-vessel-installers:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build vessel Setup.exe (Master, Engine, Deck)
        run: |
          npm run dist:sku -- VESSEL_MASTER nsis
          npm run dist:sku -- VESSEL_ENGINE nsis
          npm run dist:sku -- VESSEL_DECK nsis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish to downloads/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          $setups = @()
          Get-ChildItem dist/TVC-PMS-VESSEL_*-*-Setup.exe | ForEach-Object {
            Copy-Item $_.FullName -Destination (Join-Path downloads $_.Name) -Force
            Write-Host "Published $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)"
            if ($_.Name -match '^TVC-PMS-(VESSEL_[A-Z]+)-(.+)-Setup\.exe$') {
              $setups += [ordered]@{
                sku = $Matches[1]
                filename = $_.Name
                bytes = [int64]$_.Length
              }
            }
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $manifest = [ordered]@{
            version = $version
            generated_at = (Get-Date).ToUniversalTime().ToString('o')
            setups = $setups
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path downloads/installers.json -Encoding utf8
          Get-ChildItem downloads/TVC-PMS-VESSEL_*-*-Setup.exe | Format-Table Name, Length
          Get-Content downloads/installers.json

      - name: Commit and push downloads
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/TVC-PMS-VESSEL_*-*-Setup.exe downloads/installers.json
          if git diff --staged --quiet; then
            echo "No installer changes to commit."
            exit 0
          fi
          git commit -m "chore(downloads): publish vessel Setup.exe for web sign-in"
          git push
