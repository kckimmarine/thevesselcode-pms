<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="theme-color" content="#1a365d">
    <meta name="description" content="Maritime Toolkit — IMPA catalog, bunker calculations, lube &amp; paint cross-references, and flange engineering tables by THE VESSEL CODE.">
    <title>Maritime Toolkit | THE VESSEL CODE</title>
    <link rel="icon" type="image/png" href="icons/company-logo.png?v=20260804-logo-no-ring">
    <link rel="stylesheet" href="css/home.css?v=20260909-mkt-dark">
    <link rel="stylesheet" href="css/marketing-shell.css?v=20260909-mkt-footer">
    <link rel="stylesheet" href="css/marketing-theme.css?v=20260909-mkt-dark">
    <link rel="stylesheet" href="css/store.css?v=20260908-mobile-modal">

</head>
<body class="store-public-body store-tool-catalog mkt-page mkt-toolkit-page" data-mkt-active="toolkit">
    <div class="mkt-site-wrap">
        <div id="marketing-topbar"></div>
        <div class="store-public-shell">
        <div class="store-public-toolkit-intro" aria-hidden="false">
            <h1 class="store-public-title store-public-title-inline">⚓ Maritime Toolkit</h1>
            <p class="store-public-subtitle store-public-subtitle-inline">Instant Engineering Tools &amp; Global Marine Catalog</p>
        </div>

        <nav class="store-public-toolkit" id="storePublicToolkit" role="tablist" aria-label="Maritime utility tabs">
            <button type="button" class="store-tool-chip active" data-tool-tab="catalog" role="tab" aria-selected="true">📦 IMPA Catalog</button>
            <button type="button" class="store-tool-chip" data-tool-tab="bunker" role="tab" aria-selected="false">⛽ Bunker &amp; Fuel Calc</button>
            <button type="button" class="store-tool-chip" data-tool-tab="lube" role="tab" aria-selected="false">🛢️ Lub-Oil Cross-Ref</button>
            <button type="button" class="store-tool-chip" data-tool-tab="paint" role="tab" aria-selected="false">🎨 Paint Cross-Ref</button>
            <button type="button" class="store-tool-chip" data-tool-tab="engineering" role="tab" aria-selected="false">📐 Flange &amp; Engineering</button>
        </nav>

        <div class="store-public-panels">
            <section class="store-public-panel store-panel-active" data-tool-panel="catalog" id="storeToolCatalog">
                <main id="storeMenuBody" class="store-public-main" aria-live="polite">
                    <p class="store-loading">Loading catalog…</p>
                </main>
            </section>
            <section class="store-public-panel hidden" data-tool-panel="bunker" id="storeToolBunker" aria-label="Bunker and fuel calculator"></section>
            <section class="store-public-panel hidden" data-tool-panel="lube" id="storeToolLube" aria-label="Lubricant cross reference"></section>
            <section class="store-public-panel hidden" data-tool-panel="paint" id="storeToolPaint" aria-label="Marine paint cross reference"></section>
            <section class="store-public-panel hidden" data-tool-panel="engineering" id="storeToolEngineering" aria-label="Flange and engineering tables"></section>
        </div>

        <div id="marketing-footer"></div>
        </div>
    </div>

    <script src="js/marketing-shell.js?v=20260909-mkt-footer"></script>
    <script src="js/core/schema.js?v=20260906-plate-pipeline"></script>
    <script src="js/core/db.js?v=20260906-plate-pipeline"></script>
    <script src="js/ui/virtualList.js?v=20260723-readability"></script>
    <script src="js/services/plateImageCache.js?v=20260909-berth-index"></script>
    <script src="js/services/storeManager.js?v=20260906-maritime-toolkit"></script>
    <script src="js/ui/storeMenu.js?v=20260909-berth-plates"></script>
    <script src="js/ui/maritimeToolkit.js?v=20260906-maritime-toolkit"></script>
    <script src="js/ui/storePublicPullRefresh.js?v=20260908-pull-refresh"></script>
    <script src="js/store-public-boot.js?v=20260908-pull-refresh"></script>
</body>
</html>
